services:
  frontend:
    build:
      context: ./app
      dockerfile: dockerfile.dev
    container_name: ecoradar_frontend
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app
      - ecoradar_frontend_node_modules:/app/node_modules
    env_file:
      - ./app/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build: 
      context: ./api
      dockerfile: ./dockerfile.dev
    container_name: ecoradar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/html
      - ecoradar_backend_vendor:/var/www/html/vendor
    env_file:
      - ./api/.env
    environment:
      PORT: "8000"

  postgres:
    image: postgres:18-alpine
    container_name: ecoradar_postgres
    restart: always
    environment:
      POSTGRES_DB: ecoradar_db
      POSTGRES_USER: ecoradar
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5548:5432"
    volumes:
      - ecoradar_postgres_data:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ecoradar -d ecoradar_db"]
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
  ecoradar_postgres_data:
  ecoradar_frontend_node_modules:
  ecoradar_backend_vendor: