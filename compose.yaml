services:
  frontend:
    build:
      context: ./app
      dockerfile: dockerfile.dev
    container_name: ecordar_frontend
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app
      - ecordar_frontend_node_modules:/app/node_modules
    env_file:
      - ./app/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build: 
      context: ./api
      dockerfile: ./dockerfile.dev
    container_name: ecordar_api
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env

volumes:
  ecordar_postgres_data:
  ecordar_frontend_node_modules: